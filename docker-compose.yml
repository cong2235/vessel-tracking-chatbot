services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vessel_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vessel_app}
      POSTGRES_DB: ${POSTGRES_DB:-vessels}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vessel_app} -d ${POSTGRES_DB:-vessels}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
