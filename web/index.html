<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot tra cứu tàu biển</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; height: 100vh; display: flex; background: #f5f6f8; }

  #sidebar { width: 240px; background: #1e2430; color: #eee; display: flex; flex-direction: column; padding: 12px; flex-shrink: 0; }
  #sidebar h1 { font-size: 15px; margin: 0 0 12px; }
  #new-conv-btn { background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 12px; font-size: 14px; }
  #conv-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
  #conv-list li { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #conv-list li:hover { background: #2b3243; }
  #conv-list li.active { background: #3b82f6; }

  #chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #3b82f6; color: white; border-bottom-right-radius: 2px; }
  .msg.assistant { align-self: flex-start; background: white; border: 1px solid #ddd; border-bottom-left-radius: 2px; }
  .msg.tool { align-self: flex-start; background: #fef3c7; color: #92400e; font-size: 12px; font-family: monospace; }
  .msg.error { align-self: flex-start; background: #fee2e2; color: #991b1b; }

  #chat-form { display: flex; padding: 12px; border-top: 1px solid #ddd; background: white; gap: 8px; }
  #chat-input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; font-size: 14px; }
  #chat-form button { padding: 10px 20px; border: none; background: #3b82f6; color: white; border-radius: 20px; cursor: pointer; }

  #map-panel { width: 420px; flex-shrink: 0; border-left: 1px solid #ddd; }
  #map { width: 100%; height: 100%; }

  @media (max-width: 900px) {
    #map-panel { display: none; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <h1>🚢 Tra cứu tàu biển</h1>
  <button id="new-conv-btn">+ Hội thoại mới</button>
  <ul id="conv-list"></ul>
</div>

<div id="chat-panel">
  <div id="messages"></div>
  <form id="chat-form">
    <input id="chat-input" placeholder="Hỏi về tàu, chủ sở hữu, hành trình..." autocomplete="off">
    <button type="submit">Gửi</button>
  </form>
</div>

<div id="map-panel"><div id="map"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  let currentConversationId = null;
  let map, currentLayer;

  function initMap() {
    map = L.map('map').setView([13, 110], 5); // trung tam vung du lieu 102-118E, 6-23N
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
    }).addTo(map);
  }

  function renderGeojson(geojson) {
    if (currentLayer) map.removeLayer(currentLayer);
    currentLayer = L.geoJSON(geojson, {
      pointToLayer: (feature, latlng) => L.circleMarker(latlng, { radius: 5, color: '#3b82f6' }),
      style: { color: '#3b82f6', weight: 3 },
    }).addTo(map);
    try {
      map.fitBounds(currentLayer.getBounds(), { maxZoom: 10, padding: [20, 20] });
    } catch (e) { /* geometry rong hoac 1 diem duy nhat */ }
  }

  async function loadConversations() {
    const res = await fetch('/conversations');
    const convs = await res.json();
    const list = document.getElementById('conv-list');
    list.innerHTML = '';
    convs.forEach((c) => {
      const li = document.createElement('li');
      li.textContent = c.title || `Hội thoại ${c.id.slice(0, 8)}`;
      li.className = c.id === currentConversationId ? 'active' : '';
      li.onclick = () => openConversation(c.id);
      list.appendChild(li);
    });
  }

  async function createConversation() {
    const res = await fetch('/conversations', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}),
    });
    const conv = await res.json();
    await openConversation(conv.id);
    await loadConversations();
  }

  async function openConversation(id) {
    currentConversationId = id;
    document.getElementById('messages').innerHTML = '';
    const res = await fetch(`/conversations/${id}/messages`);
    const messages = await res.json();
    messages.forEach((m) => {
      if (m.role === 'user' || (m.role === 'assistant' && m.content)) {
        appendMessage(m.role, m.content);
      }
    });
    await loadConversations();
  }

  function appendMessage(role, text) {
    const box = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }

  async function sendMessage(text) {
    if (!currentConversationId) await createConversation();
    appendMessage('user', text);
    const assistantDiv = appendMessage('assistant', '');

    const res = await fetch(`/conversations/${currentConversationId}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const block = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        handleSseBlock(block, assistantDiv);
      }
    }
    await loadConversations();
  }

  function handleSseBlock(block, assistantDiv) {
    const lines = block.split('\n');
    const eventLine = lines.find((l) => l.startsWith('event: '));
    const dataLine = lines.find((l) => l.startsWith('data: '));
    if (!eventLine || !dataLine) return;

    const eventType = eventLine.slice('event: '.length);
    const data = JSON.parse(dataLine.slice('data: '.length));

    if (eventType === 'token') {
      assistantDiv.textContent += data;
    } else if (eventType === 'tool_call') {
      appendMessage('tool', `🔧 ${data.name}(${JSON.stringify(data.arguments)})`);
    } else if (eventType === 'data' && data.type === 'geojson') {
      renderGeojson(data.geojson);
    } else if (eventType === 'error') {
      appendMessage('error', `⚠️ ${data.message}`);
    }
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  }

  document.getElementById('new-conv-btn').onclick = createConversation;

  document.getElementById('chat-form').onsubmit = (e) => {
    e.preventDefault();
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    sendMessage(text);
  };

  initMap();
  loadConversations();
</script>
</body>
</html>
