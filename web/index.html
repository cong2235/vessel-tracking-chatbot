<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hải Trình — Chatbot tra cứu tàu biển</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230B0D0F'/%3E%3Cg fill='none' stroke='%235EEAD4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='6' r='2'/%3E%3Cpath d='M12 8v11'/%3E%3Cpath d='M7.5 12h9'/%3E%3Cpath d='M5.5 15.5a6.5 6.5 0 0 0 13 0'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0B0D0F; --sidebar:#101316; --surface:#171B1F; --surface-2:#121517; --map-bg:#0A1116;
    --border:#1D2226; --border-2:#262B30;
    --text:#E7EAED; --text-2:#C7CDD2; --text-3:#9AA2AA; --text-4:#7A828A; --muted:#5B6268; --faint:#4A5058;
    --accent:#5EEAD4; --danger:#F97171; --gap:#E8836B; --ok:#7FE0A7;
  }
  *{box-sizing:border-box;}
  body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;}
  #app{display:flex;height:100vh;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;}
  ::selection{background:#1C3B37;}

  /* ---- sidebar ---- */
  #sidebar{width:256px;min-width:256px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:margin-left .18s ease, opacity .18s ease;}
  #app.sidebar-collapsed #sidebar{margin-left:-256px;opacity:0;pointer-events:none;}
  .brand{padding:20px 18px 16px;display:flex;align-items:center;gap:9px;}
  .brand-mark{width:24px;height:24px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;}
  .brand-name{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;color:var(--text);}
  .new-chat{margin:0 14px 12px;display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:8px;border:1px solid var(--border-2);background:transparent;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;}
  .new-chat:hover{border-color:#3A4046;background:var(--surface);}
  .side-search{margin:0 14px 14px;display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;color:var(--muted);border:1px solid transparent;}
  .side-search:focus-within{border-color:var(--border-2);}
  .side-search input{border:none;background:transparent;outline:none;color:var(--text);font-family:inherit;font-size:12.5px;width:100%;}
  .side-search input::placeholder{color:var(--muted);}
  #conv-groups{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:16px;}
  .conv-group-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:0 8px 6px;}
  .conv-item{position:relative;display:flex;align-items:center;border-radius:6px;}
  .conv-item:hover{background:var(--surface);}
  .conv-item.active{background:var(--surface);}
  .conv-item button.conv-title{flex:1;min-width:0;text-align:left;border:none;background:transparent;padding:8px 8px 8px 10px;border-radius:6px;font-size:12.5px;color:var(--text-3);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv-item.active button.conv-title{color:var(--accent);border-left:2px solid var(--accent);padding-left:8px;}
  .conv-item:hover button.conv-title, .conv-item.active button.conv-title{color:var(--text);}
  .conv-item.active button.conv-title{color:var(--accent);}
  .conv-delete{opacity:0;border:none;background:transparent;color:var(--muted);cursor:pointer;padding:5px;margin-right:4px;border-radius:5px;display:flex;flex:none;}
  .conv-item:hover .conv-delete{opacity:1;}
  .conv-delete:hover{background:#241416;color:var(--danger);}
  .empty-convs{padding:10px;font-size:12px;color:var(--muted);}
  .sidebar-footer{padding:13px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px;}
  .avatar{width:28px;height:28px;border-radius:7px;background:var(--border-2);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none;}
  .footer-name{font-size:12.5px;color:var(--text);font-weight:500;}
  .footer-role{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--accent);}

  /* ---- chat panel ---- */
  #chat-panel{flex:1;display:flex;flex-direction:column;min-width:0;}
  #topbar{height:56px;min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);}
  .icon-btn{border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);border-radius:6px;width:30px;height:30px;flex:none;}
  .icon-btn:hover{background:var(--surface);color:var(--text);}
  .icon-btn:disabled{opacity:.35;cursor:default;}
  .icon-btn:disabled:hover{background:transparent;color:var(--muted);}
  .model-pill{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;border:1px solid var(--border-2);color:var(--text-2);font-family:'IBM Plex Mono',monospace;font-size:11.5px;}

  #messages{flex:1;overflow-y:auto;padding:24px 0 12px;display:flex;justify-content:center;}
  #messages-inner{max-width:600px;width:100%;padding:0 20px;display:flex;flex-direction:column;gap:20px;}
  .empty-state{margin:auto;text-align:center;color:var(--muted);padding:40px 20px;}
  .empty-state svg{color:var(--border-2);margin-bottom:10px;}
  .empty-state h2{font-family:'Space Grotesk',sans-serif;font-size:17px;color:var(--text-3);font-weight:600;margin:0 0 6px;}
  .empty-state p{font-size:13px;margin:0;}

  .bubble-user{align-self:flex-end;max-width:82%;background:var(--surface);border:1px solid var(--border-2);padding:11px 15px;border-radius:12px 12px 2px 12px;font-size:14px;line-height:1.55;color:var(--text);white-space:pre-wrap;word-break:break-word;}

  .turn-assistant{display:flex;gap:12px;}
  .avatar-ai{width:24px;height:24px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px;}
  .assistant-body{flex:1;min-width:0;font-size:14px;line-height:1.6;color:var(--text-2);}
  .assistant-body.pending::after{content:"●●●";color:var(--muted);letter-spacing:2px;animation:blink 1.2s infinite;}
  @keyframes blink{0%,100%{opacity:.3;}50%{opacity:1;}}
  .assistant-body p{margin:0 0 8px;}
  .assistant-body p:last-child{margin-bottom:0;}
  .assistant-body ul,.assistant-body ol{margin:8px 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;}
  .assistant-body strong{color:var(--text);}
  .assistant-body table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px;}
  .assistant-body th,.assistant-body td{border:1px solid var(--border-2);padding:6px 9px;text-align:left;}
  .assistant-body th{background:var(--surface);color:var(--text-3);font-weight:500;}
  .assistant-body code{background:#05070A;border:1px solid var(--border);color:var(--accent);padding:1px 5px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  .assistant-body pre{background:#05070A;border:1px solid var(--border);padding:14px 16px;border-radius:8px;overflow:auto;margin:8px 0;}
  .assistant-body pre code{border:none;padding:0;background:none;}
  .msg-actions{display:flex;gap:8px;margin-top:8px;}
  .msg-icon-btn{border:none;background:transparent;display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:5px;font-size:11px;font-family:inherit;}
  .msg-icon-btn:hover{background:var(--surface);color:var(--text-2);}

  .trace{display:flex;flex-direction:column;gap:8px;padding-left:36px;}
  .trace-summary{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;width:fit-content;font-size:11.5px;color:var(--text-4);cursor:pointer;user-select:none;}
  .trace-summary:hover{border-color:var(--border-2);}
  .trace-summary .chevron{display:flex;transition:transform .15s;}
  .trace.expanded .trace-summary .chevron{transform:rotate(90deg);}
  .trace-steps{display:none;flex-direction:column;gap:5px;padding-left:9px;border-left:2px solid var(--border);}
  .trace.expanded .trace-steps{display:flex;}
  .trace-step{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-4);}
  .trace-step .args{font-family:'IBM Plex Mono',monospace;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .msg-error{align-self:flex-start;display:flex;align-items:center;gap:8px;background:#1E1315;border:1px solid #3A1E20;color:#F5A9A9;padding:10px 14px;border-radius:10px;font-size:12.5px;max-width:82%;}

  #composer-wrap{padding:14px 20px 10px;display:flex;justify-content:center;}
  #chat-form{max-width:600px;width:100%;border:1px solid var(--border-2);border-radius:12px;background:var(--surface-2);padding:6px 6px 6px 16px;display:flex;align-items:center;gap:8px;}
  #chat-form:focus-within{border-color:var(--accent);}
  #chat-input{flex:1;border:none;background:transparent;outline:none;color:var(--text);font-family:inherit;font-size:14px;padding:8px 0;}
  #chat-input::placeholder{color:var(--muted);}
  #chat-input:disabled{color:var(--muted);}
  #send-btn{width:32px;height:32px;border-radius:7px;border:none;background:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  #send-btn:disabled{background:var(--border-2);cursor:default;}
  #hint{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);padding-bottom:14px;}

  /* ---- map panel ---- */
  #map-panel{width:400px;min-width:400px;border-left:1px solid var(--border);background:var(--map-bg);display:flex;flex-direction:column;}
  #map-topbar{height:56px;min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border);}
  #map-title{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px;font-weight:500;}
  #map-body{flex:1;position:relative;min-height:0;}
  #map{width:100%;height:100%;background:var(--map-bg);}
  .leaflet-control-attribution{background:rgba(10,17,22,.75) !important;color:var(--muted) !important;}
  .leaflet-control-attribution a{color:var(--text-4) !important;}
  .leaflet-control-zoom a{background:var(--surface-2) !important;color:var(--text-2) !important;border-color:var(--border) !important;}
  #map-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted);text-align:center;padding:0 30px;pointer-events:none;}
  #map-empty svg{color:var(--border-2);}
  #map-empty p{font-size:12.5px;margin:0;max-width:220px;}
  #map-summary{position:absolute;left:16px;right:16px;bottom:16px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;display:none;}
  #map-summary.visible{display:block;}
  #map-summary .ms-title{font-size:13px;font-weight:600;color:var(--text);}
  #map-summary .ms-title .mono{font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:10.5px;color:var(--muted);}
  #map-summary .ms-stats{display:flex;gap:20px;margin-top:10px;flex-wrap:wrap;}
  #map-summary .ms-stat-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);}
  #map-summary .ms-stat-value{font-size:13.5px;color:var(--text);margin-top:2px;}
  #map-summary .ms-badge{display:inline-block;margin-top:8px;font-size:10.5px;font-family:'IBM Plex Mono',monospace;color:var(--gap);background:#241614;border:1px solid #3A241E;padding:2px 8px;border-radius:12px;}

  @media (max-width:960px){ #map-panel{display:none;} }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B0D0F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v13"/><path d="M7 11h10"/><path d="M5 15a7 7 0 0 0 14 0"/></svg>
      </div>
      <div class="brand-name">Hải Trình</div>
    </div>

    <button type="button" class="new-chat" id="new-conv-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Hội thoại mới
    </button>

    <label class="side-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="conv-search" placeholder="Tìm hội thoại" autocomplete="off">
    </label>

    <div id="conv-groups"></div>

    <div class="sidebar-footer">
      <div class="avatar">AC</div>
      <div style="min-width:0;">
        <div class="footer-name">Alex Chen</div>
        <div class="footer-role">PHÂN TÍCH</div>
      </div>
    </div>
  </aside>

  <main id="chat-panel">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:14px;">
        <button type="button" class="icon-btn" id="sidebar-toggle" aria-label="Ẩn/hiện sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <div class="model-pill">gpt-oss-20b</div>
      </div>
      <button type="button" class="icon-btn" id="delete-conv-btn" aria-label="Xoá hội thoại hiện tại" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13"/><path d="M9 7V4h6v3"/></svg>
      </button>
    </div>

    <div id="messages"><div id="messages-inner"></div></div>

    <div id="composer-wrap">
      <form id="chat-form">
        <input id="chat-input" placeholder="Hỏi về tàu, chủ sở hữu, hành trình…" autocomplete="off">
        <button type="submit" id="send-btn" aria-label="Gửi tin nhắn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B0D0F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
    </div>
    <div id="hint">Hải Trình có thể trả lời sai — luôn đối chiếu với dữ liệu AIS/đăng kiểm gốc.</div>
  </main>

  <aside id="map-panel">
    <div id="map-topbar">
      <div id="map-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
        Bản đồ hành trình
      </div>
    </div>
    <div id="map-body">
      <div id="map"></div>
      <div id="map-empty">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
        <p>Vị trí, hành trình và điểm mất tín hiệu AIS sẽ hiện ở đây khi được nhắc tới trong hội thoại.</p>
      </div>
      <div id="map-summary"></div>
    </div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/marked@12/marked.min.js"></script>
<script src="https://unpkg.com/dompurify@3/dist/purify.min.js"></script>
<script>
  // ---------------------------------------------------------------------
  // Icon + tool metadata (thay emoji bang SVG stroke-icon cho dong bo giao dien)
  // ---------------------------------------------------------------------
  const ICONS = {
    search: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
    document: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 12h5M9.5 15h5"/></svg>',
    building: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="10" height="18"/><path d="M15 8h4v13h-4"/><path d="M8 7h1M11 7h1M8 11h1M11 11h1M8 15h1M11 15h1"/></svg>',
    pin: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.2"/></svg>',
    compass: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.3 8.7l-2.1 4.9-4.9 2.1 2.1-4.9z"/></svg>',
    map: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>',
    signalOff: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/><path d="M2 2l20 20"/></svg>',
    ship: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l1.5 5h15L21 15"/><path d="M5 15l1-8h12l1 8"/><path d="M12 3v4M9 7h6"/></svg>',
    chart: '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>',
    wrench: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.8 2.8-2-2z"/></svg>',
    copy: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></svg>',
    retry: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 4v5h-5"/></svg>',
    trash: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13"/><path d="M9 7V4h6v3"/></svg>',
    chevron: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    warning: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.8 17a2 2 0 001.7 3h15a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>',
  };

  const TOOL_META = {
    search_vessel: [ICONS.search, "Tìm kiếm tàu"],
    get_vessel_info: [ICONS.document, "Lấy thông tin chi tiết tàu"],
    get_company_vessels: [ICONS.building, "Tra cứu công ty & tàu liên quan"],
    get_position_at_time: [ICONS.pin, "Tra cứu vị trí tại thời điểm"],
    get_journey: [ICONS.compass, "Tính hành trình"],
    get_multi_journey_geojson: [ICONS.map, "Lấy hành trình nhiều tàu"],
    compare_journeys: [ICONS.chart, "So sánh quãng đường nhiều tàu"],
    get_dark_gaps: [ICONS.signalOff, "Tra cứu mất tín hiệu AIS"],
    list_vessels_by_type: [ICONS.ship, "Lọc tàu theo loại"],
  };

  function renderMarkdown(text) {
    const html = marked.parse(text || "", { breaks: true });
    return DOMPurify.sanitize(html);
  }

  // ---------------------------------------------------------------------
  // Map (Leaflet, nen toi CartoDB dark_matter cho khop giao dien)
  // ---------------------------------------------------------------------
  let map, currentLayer;
  const ACCENT = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();

  function initMap() {
    map = L.map('map', { attributionControl: true, zoomControl: true }).setView([13, 110], 5); // trung tam vung du lieu 102-118E, 6-23N
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 19,
    }).addTo(map);
  }

  function renderGeojson(tool, geojson, summary) {
    document.getElementById('map-empty').style.display = 'none';
    if (currentLayer) map.removeLayer(currentLayer);
    currentLayer = L.geoJSON(geojson, {
      pointToLayer: (feature, latlng) => L.circleMarker(latlng, { radius: 6, color: ACCENT, weight: 2, fillColor: ACCENT, fillOpacity: 0.6 }),
      style: (feature) => ({ color: tool === 'get_dark_gaps' ? '#E8836B' : ACCENT, weight: 3, dashArray: tool === 'get_dark_gaps' ? '2 7' : null }),
    }).addTo(map);
    try {
      map.fitBounds(currentLayer.getBounds(), { maxZoom: 11, padding: [24, 24] });
    } catch (e) { /* geometry rong hoac 1 diem duy nhat */ }
    renderSummaryCard(tool, summary);
  }

  function fmtNm(v) { return v == null ? '—' : `${Number(v).toFixed(1)} hải lý`; }
  function fmtKn(v) { return v == null ? '—' : `${Number(v).toFixed(1)} hải lý/h`; }
  function fmtDuration(seconds) {
    if (seconds == null) return '—';
    const h = Math.floor(seconds / 3600), m = Math.round((seconds % 3600) / 60);
    return `${h}g${m ? ' ' + m + 'p' : ''}`;
  }
  function statBlock(label, value) {
    return `<div><div class="ms-stat-label">${label}</div><div class="ms-stat-value">${value}</div></div>`;
  }

  // summary = chinh ket qua tool da bo geojson (xem src/agent/agent.py) - so
  // lieu that do tool tinh, khong bia them o FE.
  function renderSummaryCard(tool, summary) {
    const el = document.getElementById('map-summary');
    if (!summary) { el.classList.remove('visible'); return; }
    let title = '', stats = '', badge = '';

    if (tool === 'get_journey') {
      title = `Hành trình <span class="mono">· tàu ${String(summary.vessel_id || '').slice(0, 8)}</span>`;
      stats = statBlock('Quãng đường', fmtNm(summary.distance_nm)) + statBlock('Tốc độ TB', fmtKn(summary.avg_speed_knots)) + statBlock('Số điểm AIS', summary.num_points ?? '—');
    } else if (tool === 'get_position_at_time') {
      title = `Vị trí <span class="mono">· tàu ${String(summary.vessel_id || '').slice(0, 8)}</span>`;
      stats = statBlock('Vĩ độ / Kinh độ', `${Number(summary.lat).toFixed(3)}, ${Number(summary.lon).toFixed(3)}`) + statBlock('Tốc độ', fmtKn(summary.speed_knots)) + statBlock('Thời điểm dữ liệu', summary.event_ts ? summary.event_ts.replace('T', ' ').slice(0, 16) : '—');
      if (summary.is_stale) badge = `<span class="ms-badge">Dữ liệu cũ — cách xa thời điểm hỏi</span>`;
      else if (summary.is_interpolated) badge = `<span class="ms-badge" style="color:var(--text-3);background:var(--surface);border-color:var(--border-2);">Toạ độ nội suy</span>`;
    } else if (tool === 'get_dark_gaps') {
      const gaps = summary.gaps || [];
      title = `Mất tín hiệu AIS <span class="mono">· ${gaps.length} lần</span>`;
      const top = gaps[0];
      stats = top
        ? statBlock('Dài nhất trong kết quả', fmtDuration(top.gap_duration_seconds)) + statBlock('Quãng đường ước tính', fmtNm(top.distance_nm)) + statBlock('Tốc độ ngụ ý', fmtKn(top.implied_speed_knots))
        : '';
    } else if (tool === 'get_multi_journey_geojson') {
      title = `Nhiều hành trình <span class="mono">· ${summary.num_vessels ?? 0} tàu</span>`;
      stats = statBlock('Tổng số điểm AIS', summary.total_points ?? '—') + statBlock('Trang', `${summary.page ?? 1}${summary.has_more ? ' (còn nữa)' : ''}`, );
      if (summary.has_more) badge = `<span class="ms-badge">Còn ${summary.total_vessels_requested - summary.page * summary.page_size} tàu chưa tải</span>`;
    } else {
      el.classList.remove('visible');
      return;
    }

    el.innerHTML = `<div class="ms-title">${title}</div><div class="ms-stats">${stats}</div>${badge}`;
    el.classList.add('visible');
  }

  // ---------------------------------------------------------------------
  // Conversations (sidebar)
  // ---------------------------------------------------------------------
  let currentConversationId = null;
  let allConversations = [];

  function dateBucket(iso) {
    const d = new Date(iso);
    const now = new Date();
    const startOfDay = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diffDays = Math.round((startOfDay(now) - startOfDay(d)) / 86400000);
    if (diffDays <= 0) return 'Hôm nay';
    if (diffDays === 1) return 'Hôm qua';
    if (diffDays <= 7) return '7 ngày qua';
    return 'Cũ hơn';
  }

  async function loadConversations() {
    const res = await fetch('/conversations');
    allConversations = await res.json();
    allConversations.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
    renderConversationList();
  }

  function renderConversationList() {
    const query = document.getElementById('conv-search').value.trim().toLowerCase();
    const filtered = allConversations.filter((c) => (c.title || 'Cuộc trò chuyện mới').toLowerCase().includes(query));
    const groups = new Map();
    filtered.forEach((c) => {
      const bucket = dateBucket(c.updated_at);
      if (!groups.has(bucket)) groups.set(bucket, []);
      groups.get(bucket).push(c);
    });

    const container = document.getElementById('conv-groups');
    container.innerHTML = '';
    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-convs">${query ? 'Không tìm thấy hội thoại phù hợp.' : 'Chưa có hội thoại nào.'}</div>`;
      return;
    }

    ['Hôm nay', 'Hôm qua', '7 ngày qua', 'Cũ hơn'].forEach((bucket) => {
      const convs = groups.get(bucket);
      if (!convs || convs.length === 0) return;
      const groupEl = document.createElement('div');
      const label = document.createElement('div');
      label.className = 'conv-group-label';
      label.textContent = bucket;
      groupEl.appendChild(label);
      const list = document.createElement('div');
      list.style.cssText = 'display:flex;flex-direction:column;gap:1px;';
      convs.forEach((c) => list.appendChild(buildConvItem(c)));
      groupEl.appendChild(list);
      container.appendChild(groupEl);
    });
  }

  function buildConvItem(c) {
    const item = document.createElement('div');
    item.className = 'conv-item' + (c.id === currentConversationId ? ' active' : '');

    const titleBtn = document.createElement('button');
    titleBtn.type = 'button';
    titleBtn.className = 'conv-title';
    titleBtn.textContent = c.title || 'Cuộc trò chuyện mới';
    titleBtn.onclick = () => openConversation(c.id);

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'conv-delete';
    delBtn.setAttribute('aria-label', 'Xoá hội thoại');
    delBtn.innerHTML = ICONS.trash;
    delBtn.onclick = (e) => { e.stopPropagation(); deleteConversation(c.id); };

    item.appendChild(titleBtn);
    item.appendChild(delBtn);
    return item;
  }

  async function deleteConversation(id) {
    if (!confirm('Xoá hội thoại này? Không thể hoàn tác.')) return;
    await fetch(`/conversations/${id}`, { method: 'DELETE' });
    if (id === currentConversationId) resetChatPanel();
    await loadConversations();
  }

  function resetChatPanel() {
    currentConversationId = null;
    document.getElementById('messages-inner').innerHTML = '';
    showEmptyState();
    document.getElementById('delete-conv-btn').disabled = true;
    if (currentLayer) { map.removeLayer(currentLayer); currentLayer = null; }
    document.getElementById('map-empty').style.display = 'flex';
    document.getElementById('map-summary').classList.remove('visible');
  }

  function showEmptyState() {
    document.getElementById('messages-inner').innerHTML = `
      <div class="empty-state">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l1.5 5h15L21 15"/><path d="M5 15l1-8h12l1 8"/><path d="M12 3v4M9 7h6"/></svg>
        <h2>Bắt đầu tra cứu</h2>
        <p>Hỏi về một con tàu, chủ sở hữu, hành trình hoặc lần mất tín hiệu AIS.</p>
      </div>`;
  }

  async function createConversation() {
    const res = await fetch('/conversations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) });
    const conv = await res.json();
    currentConversationId = conv.id;
    document.getElementById('messages-inner').innerHTML = '';
    document.getElementById('delete-conv-btn').disabled = false;
    await loadConversations();
  }

  async function openConversation(id) {
    currentConversationId = id;
    document.getElementById('delete-conv-btn').disabled = false;
    const inner = document.getElementById('messages-inner');
    inner.innerHTML = '';
    const res = await fetch(`/conversations/${id}/messages`);
    const messages = await res.json();
    messages.forEach((m) => {
      if (m.role === 'user') {
        lastUserMessage = m.content;
        appendUserBubble(m.content);
      } else if (m.role === 'assistant' && m.content) {
        appendAssistantBubble(m.content);
      }
    });
    if (!messages.length) showEmptyState();
    scrollToBottom();
    renderConversationList();
  }

  function scrollToBottom() {
    const box = document.getElementById('messages');
    box.scrollTop = box.scrollHeight;
  }

  // ---------------------------------------------------------------------
  // Message rendering
  // ---------------------------------------------------------------------
  function appendUserBubble(text) {
    const inner = document.getElementById('messages-inner');
    const div = document.createElement('div');
    div.className = 'bubble-user';
    div.textContent = text;
    inner.appendChild(div);
    scrollToBottom();
  }

  function addMessageActions(container, getText) {
    const row = document.createElement('div');
    row.className = 'msg-actions';
    const copyBtn = document.createElement('button');
    copyBtn.type = 'button'; copyBtn.className = 'msg-icon-btn'; copyBtn.innerHTML = ICONS.copy;
    copyBtn.setAttribute('aria-label', 'Sao chép câu trả lời');
    copyBtn.onclick = () => navigator.clipboard.writeText(getText()).catch(() => {});
    row.appendChild(copyBtn);
    container.appendChild(row);
    return row;
  }

  function appendAssistantBubble(text) {
    const inner = document.getElementById('messages-inner');
    const turn = document.createElement('div');
    turn.className = 'turn-assistant';
    turn.innerHTML = `<div class="avatar-ai"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0B0D0F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v13"/><path d="M7 11h10"/><path d="M5 15a7 7 0 0 0 14 0"/></svg></div>
      <div class="assistant-body"></div>`;
    const body = turn.querySelector('.assistant-body');
    body.innerHTML = renderMarkdown(text);
    addMessageActions(turn, () => text);
    inner.appendChild(turn);
    scrollToBottom();
  }

  function appendError(message) {
    const inner = document.getElementById('messages-inner');
    const div = document.createElement('div');
    div.className = 'msg-error';
    div.innerHTML = `${ICONS.warning}<span>${message}</span>`;
    inner.appendChild(div);
    scrollToBottom();
  }

  function startAssistantTurn() {
    const inner = document.getElementById('messages-inner');

    const traceWrap = document.createElement('div');
    traceWrap.className = 'trace';
    traceWrap.style.display = 'none';
    const summary = document.createElement('div');
    summary.className = 'trace-summary';
    summary.innerHTML = `<span class="chevron">${ICONS.chevron}</span><span class="label">Đang xử lý…</span>`;
    const steps = document.createElement('div');
    steps.className = 'trace-steps';
    summary.onclick = () => traceWrap.classList.toggle('expanded');
    traceWrap.appendChild(summary);
    traceWrap.appendChild(steps);
    inner.appendChild(traceWrap);

    const turn = document.createElement('div');
    turn.className = 'turn-assistant';
    turn.innerHTML = `<div class="avatar-ai"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0B0D0F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v13"/><path d="M7 11h10"/><path d="M5 15a7 7 0 0 0 14 0"/></svg></div>
      <div class="assistant-body pending"></div>`;
    inner.appendChild(turn);
    scrollToBottom();

    return { traceWrap, summary, steps, body: turn.querySelector('.assistant-body'), turn, stepCount: 0, rawText: '' };
  }

  function addTraceStep(state, name, args) {
    const [icon, label] = TOOL_META[name] || [ICONS.wrench, name];
    state.stepCount += 1;
    state.traceWrap.style.display = '';
    state.summary.querySelector('.label').textContent = `Đã dùng ${state.stepCount} bước tra cứu dữ liệu`;

    const step = document.createElement('div');
    step.className = 'trace-step';
    const argsText = Object.keys(args || {}).length ? JSON.stringify(args) : '';
    step.innerHTML = `${icon}<span>${label}</span>` + (argsText ? `<span class="args">${argsText}</span>` : '');
    state.steps.appendChild(step);
    scrollToBottom();
  }

  function finalizeTrace(state) {
    state.traceWrap.classList.remove('expanded');
  }

  // ---------------------------------------------------------------------
  // Sending
  // ---------------------------------------------------------------------
  let isSending = false;
  let lastUserMessage = '';

  async function sendMessage(text) {
    if (isSending) return;
    isSending = true;
    document.getElementById('chat-input').disabled = true;
    document.getElementById('send-btn').disabled = true;

    try {
      if (!currentConversationId) await createConversation();
      lastUserMessage = text;
      appendUserBubble(text);
      const state = startAssistantTurn();

      let res;
      try {
        res = await fetch(`/conversations/${currentConversationId}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
      } catch (e) {
        appendError('Không kết nối được tới server.');
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf('\n\n')) !== -1) {
            const block = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            handleSseBlock(block, state);
          }
        }
      } catch (e) {
        appendError('Mất kết nối trong khi nhận phản hồi.');
      }

      if (state.rawText) addMessageActions(state.turn, () => state.rawText);
    } finally {
      await loadConversations();
      isSending = false;
      document.getElementById('chat-input').disabled = false;
      document.getElementById('send-btn').disabled = false;
      document.getElementById('chat-input').focus();
    }
  }

  function handleSseBlock(block, state) {
    const lines = block.split('\n');
    const eventLine = lines.find((l) => l.startsWith('event: '));
    const dataLine = lines.find((l) => l.startsWith('data: '));
    if (!eventLine || !dataLine) return;

    const eventType = eventLine.slice('event: '.length);
    const data = JSON.parse(dataLine.slice('data: '.length));

    if (eventType === 'token') {
      if (state.rawText === '') finalizeTrace(state);
      state.rawText += data;
      state.body.classList.remove('pending');
      state.body.innerHTML = renderMarkdown(state.rawText);
    } else if (eventType === 'tool_call') {
      addTraceStep(state, data.name, data.arguments);
    } else if (eventType === 'data' && data.type === 'geojson') {
      renderGeojson(data.tool, data.geojson, data.summary);
    } else if (eventType === 'done') {
      finalizeTrace(state);
      state.body.classList.remove('pending');
      if (data.answer) { state.rawText = data.answer; state.body.innerHTML = renderMarkdown(state.rawText); }
    } else if (eventType === 'error') {
      finalizeTrace(state);
      state.body.classList.remove('pending');
      if (!state.rawText) state.turn.remove();
      appendError(data.message);
    }
    scrollToBottom();
  }

  document.getElementById('new-conv-btn').onclick = async () => { await createConversation(); showEmptyState(); };
  document.getElementById('conv-search').addEventListener('input', renderConversationList);
  document.getElementById('sidebar-toggle').onclick = () => document.getElementById('app').classList.toggle('sidebar-collapsed');
  document.getElementById('delete-conv-btn').onclick = () => { if (currentConversationId) deleteConversation(currentConversationId); };

  document.getElementById('chat-form').onsubmit = (e) => {
    e.preventDefault();
    if (isSending) return;
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    sendMessage(text);
  };

  showEmptyState();
  initMap();
  loadConversations();
</script>
</body>
</html>
